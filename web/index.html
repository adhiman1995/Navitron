<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Navitron</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%238c6450'/%3E%3Cpath d='M2 11l4-5 3 3 2-2 3 4z' fill='%23eceae3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/maplibre-gl.css">
<style>
  :root {
    --panel: rgba(255, 255, 255, 0.92);
    --ink: #24231f;
    --muted: #6b6960;
    --line: rgba(0, 0, 0, 0.1);
    --accent: #8c6450;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    /* Dark, so the globe reads against space at low zoom. Invisible once the
       map fills the viewport in Mercator. */
    background: #0d1117;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; }

  #panel {
    position: absolute;
    top: 12px; left: 12px;
    z-index: 2;
    width: 232px;
    max-height: calc(100% - 24px);
    overflow-y: auto;
    padding: 12px 14px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
  }
  #panel h1 { margin: 0 0 2px; font-size: 14px; letter-spacing: 0.02em; }
  #panel .sub { margin: 0 0 10px; color: var(--muted); font-size: 11px; }
  fieldset { margin: 0 0 10px; padding: 0; border: 0; }
  legend {
    padding: 0; margin-bottom: 6px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted);
  }
  label.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  label.row input { accent-color: var(--accent); }
  label.row input:disabled + span { color: #a8a59c; }
  .slider { display: block; }
  .slider .head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .slider input { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btns button {
    padding: 6px 4px; font: inherit; font-size: 11px;
    color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  .btns button:hover { background: #f4f1ea; }
  #status {
    margin-top: 4px; padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  #fatal {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 5;
    width: min(620px, calc(100% - 24px));
    padding: 14px 16px;
    background: #fff6e8;
    border: 1px solid #e0b172;
    border-left: 4px solid #c8822f;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  #fatal h2 { margin: 0 0 6px; font-size: 14px; }
  #fatal p { margin: 0 0 6px; }
  #fatal pre {
    margin: 0 0 8px; padding: 8px 10px;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
    background: #2c2a26; color: #f2eee4; border-radius: 6px;
    user-select: all;
  }
  #fatal-close {
    position: absolute; top: 8px; right: 10px;
    padding: 0 4px; font-size: 16px; line-height: 1;
    color: var(--muted); background: none; border: 0; cursor: pointer;
  }

  @media (max-width: 560px) {
    #panel { width: calc(100% - 24px); max-height: 46%; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="fatal" hidden>
  <button id="fatal-close" type="button" aria-label="Dismiss">&times;</button>
  <div id="fatal-body"></div>
</div>

<div id="panel">
  <h1>Navitron</h1>
  <p class="sub">Self-hosted vector + terrain. No third-party services.</p>

  <fieldset>
    <legend>Layers</legend>
    <label class="row"><input type="checkbox" id="t-terrain"><span>3D terrain</span></label>
    <label class="row"><input type="checkbox" id="t-buildings"><span>3D buildings</span></label>
    <label class="row"><input type="checkbox" id="t-hillshade"><span>Hillshade</span></label>
  </fieldset>

  <fieldset>
    <legend>Terrain</legend>
    <label class="slider" for="exag">
      <span class="head"><span>Exaggeration</span><span id="exag-val">1.5&times;</span></span>
      <input type="range" id="exag" min="0" max="4" step="0.1" value="1.5">
    </label>
  </fieldset>

  <fieldset>
    <legend>Sun</legend>
    <label class="slider" for="sun-az">
      <span class="head"><span>Direction</span><span id="sun-az-val">135&deg;</span></span>
      <input type="range" id="sun-az" min="0" max="360" step="5" value="135">
    </label>
    <label class="slider" for="sun-alt">
      <span class="head"><span>Height</span><span id="sun-alt-val">45&deg;</span></span>
      <input type="range" id="sun-alt" min="5" max="90" step="1" value="45">
    </label>
  </fieldset>

  <fieldset>
    <legend>Camera</legend>
    <div class="btns">
      <button type="button" id="c-pitch">Tilt / flat</button>
      <button type="button" id="c-north">Face north</button>
      <button type="button" id="c-spin">Rotate 90&deg;</button>
      <button type="button" id="c-home">Reset view</button>
    </div>
  </fieldset>

  <div id="status">Loading&hellip;</div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
